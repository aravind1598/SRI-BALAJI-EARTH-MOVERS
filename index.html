<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FamilyGuard Ultra Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:Poppins;
background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.container{
width:95%;
max-width:420px;
padding:20px;
border-radius:20px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(25px);
box-shadow:0 20px 50px rgba(0,0,0,0.6);
}
h2{text-align:center;}
button,input{
width:100%;
padding:12px;
margin:6px 0;
border:none;
border-radius:12px;
font-weight:600;
}
.login{background:#22c55e;}
.kid{background:#ef4444;}
.parent{background:#6366f1;}
.sound{background:#fbbf24;color:black;}
.sos{background:#dc2626;}
.logout{background:#475569;}
#map{height:260px;margin-top:10px;border-radius:12px;}
#status{text-align:center;font-size:13px;margin-top:8px;}
</style>
</head>

<body>

<div class="container">

<h2>🛡️ FamilyGuard Ultra</h2>

<button class="login" onclick="login()">🔐 Login with Google</button>
<button class="logout" onclick="logout()">🚪 Logout</button>

<p id="user"></p>

<button class="kid" onclick="startKid()">📱 Start Tracking</button>
<button class="parent" onclick="startParent()">👨 View Devices</button>
<button class="sound" onclick="triggerSound()">🔔 Sound Alert</button>
<button class="sos" onclick="sendSOS()">🚨 SOS</button>

<div id="status">Not logged in</div>
<div id="map"></div>

</div>

<audio id="audio">
<source src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3">
</audio>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// 🔥 Firebase config
const firebaseConfig = {
apiKey: "AIzaSyDxxf9PEJ0hUupjNeFmmL7YXm31oQrBbJs",
authDomain: "mobile-tracking-3efc1.firebaseapp.com",
databaseURL: "https://mobile-tracking-3efc1-default-rtdb.firebaseio.com",
projectId: "mobile-tracking-3efc1"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let userID = null;
let marker;
let audio = document.getElementById("audio");
let interacted = false;

document.body.addEventListener("click",()=>interacted=true);

// 🗺 MAP
let map = L.map('map').setView([13.08,80.27],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

// 🔐 LOGIN (FIXED)
function login(){
let provider = new firebase.auth.GoogleAuthProvider();

provider.setCustomParameters({ prompt:'select_account' });

auth.signInWithPopup(provider)
.then(res=>{
userID = res.user.uid;
document.getElementById("user").innerText = "👤 " + res.user.email;
document.getElementById("status").innerText = "✅ Logged in";
})
.catch(err=>{
console.error(err);
auth.signInWithRedirect(provider);
});
}

// 🔓 LOGOUT
function logout(){
auth.signOut();
userID = null;
document.getElementById("user").innerText="";
document.getElementById("status").innerText="Logged out";
}

// 📱 TRACKING
function startKid(){
if(!userID) return alert("Login first!");

// online
db.ref("secure/"+userID).update({online:true});

// battery
setInterval(()=>{
navigator.getBattery().then(b=>{
db.ref("secure/"+userID).update({
battery:Math.round(b.level*100)
});
});
},30000);

// sound receive
db.ref("secure/"+userID+"/sound").on("value",snap=>{
if(snap.val()){
if(interacted){
audio.currentTime=0;
audio.play();
}
setTimeout(()=>{
audio.pause();
db.ref("secure/"+userID).update({sound:false});
},5000);
}
});

// GPS
navigator.geolocation.watchPosition(pos=>{
let lat=pos.coords.latitude;
let lng=pos.coords.longitude;

db.ref("secure/"+userID).update({
lat,lng,
time:new Date().toLocaleTimeString()
});

if(marker) map.removeLayer(marker);
marker=L.marker([lat,lng]).addTo(map);

map.setView([lat,lng],17);

document.getElementById("status").innerText="📍 Tracking ON";

});

// offline
window.addEventListener("beforeunload",()=>{
db.ref("secure/"+userID).update({online:false});
});
}

// 👨 VIEW DEVICES
function startParent(){

db.ref("secure").on("value",snap=>{

map.eachLayer(l=>{
if(l instanceof L.Marker) map.removeLayer(l);
});

snap.forEach(child=>{
let d = child.val();

if(d.lat){
let m = L.marker([d.lat,d.lng]).addTo(map);

m.bindPopup(`
📱 ${child.key}<br>
🔋 ${d.battery||"?"}%<br>
${d.online?"🟢 Online":"🔴 Offline"}<br>
⏰ ${d.time||""}
`);

// SOS ALERT
if(d.sos){
alert("🚨 SOS ALERT!");
db.ref("secure/"+child.key).update({sos:false});
}

}
});

});
}

// 🔔 SEND SOUND
function triggerSound(){
if(!userID) return;
db.ref("secure/"+userID).update({sound:true});
}

// 🚨 SOS
function sendSOS(){
if(!userID) return;
db.ref("secure/"+userID).update({sos:true});
}

</script>

</body>
</html>
