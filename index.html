<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyGuard Pro | Live Tracking</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root { --glass: rgba(255, 255, 255, 0.15); --primary: #6366f1; --secondary: #f43f5e; }
        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container {
            width: 90%; max-width: 450px; padding: 30px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; font-weight: 600; letter-spacing: 1px; margin-bottom: 25px; }
        input {
            width: 100%; padding: 15px; margin-bottom: 20px; border: none;
            border-radius: 12px; background: rgba(255,255,255,0.1);
            color: white; outline: none; box-sizing: border-box; font-size: 16px;
        }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button {
            padding: 15px; border: none; border-radius: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; font-family: 'Poppins';
        }
        .btn-kid { background: var(--secondary); color: white; }
        .btn-parent { background: var(--primary); color: white; }
        .btn-sound { grid-column: span 2; background: #fbbf24; color: #000; margin-top: 10px; }
        button:active { transform: scale(0.95); }
        #map { height: 300px; width: 100%; border-radius: 18px; margin-top: 25px; border: 1px solid rgba(255,255,255,0.2); }
        #status { font-size: 13px; text-align: center; margin-top: 15px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛡️ FamilyGuard <span style="color:var(--primary)">Pro</span></h2>
    <input type="email" id="email" placeholder="Enter Family Email ID">
    
    <div class="btn-grid">
        <button class="btn-kid" onclick="startKidMode()">Kid Mode</button>
        <button class="btn-parent" onclick="startParentMode()">Parent Mode</button>
        <button class="btn-sound" onclick="triggerSound()">🔔 Play Emergency Sound</button>
    </div>

    <div id="status">Status: Waiting for action...</div>
    <div id="map"></div>
</div>

<audio id="alertSound" loop>
    <source src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3" type="audio/mpeg">
</audio>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // --- NEE KUDUTHA CONFIG INGA ADD PANNITEN ---
    const firebaseConfig = {
        apiKey: "AIzaSyDxxf9PEJ0hUupjNeFmmL7YXm31oQrBbJs",
        authDomain: "mobile-tracking-3efc1.firebaseapp.com",
        databaseURL: "https://mobile-tracking-3efc1-default-rtdb.firebaseio.com",
        projectId: "mobile-tracking-3efc1",
        storageBucket: "mobile-tracking-3efc1.firebasestorage.app",
        messagingSenderId: "866207602085",
        appId: "1:866207602085:web:9c662af32dfd06c275444c",
        measurementId: "G-MBVQ711KH3"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Map Setup (Dark Theme)
    let map = L.map('map').setView([13.08, 80.27], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    let marker = L.marker([0,0]).addTo(map);
    const audio = document.getElementById('alertSound');

    function getID() { 
        const email = document.getElementById('email').value;
        return btoa(email).replace(/=/g, ""); 
    }

    // --- KID MODE: Location Anupurathu ---
    function startKidMode() {
        const id = getID();
        if(!id) return alert("Email podunga!");
        
        document.getElementById('status').innerText = "📍 Tracking Active... Stay Safe!";
        
        // Sound Trigger Listener
        db.ref('tracking/' + id + '/sound_trigger').on('value', (snap) => {
            if(snap.val() === true) {
                audio.play();
                setTimeout(() => { 
                    audio.pause(); 
                    db.ref('tracking/' + id).update({ sound_trigger: false });
                }, 6000); // 6 seconds satham kekkum
            }
        });

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                db.ref('tracking/' + id).update({
                    lat: lat,
                    lng: lng,
                    lastSeen: new Date().toLocaleTimeString()
                });
                marker.setLatLng([lat, lng]);
                map.setView([lat, lng], 17);
            }, null, { enableHighAccuracy: true });
        }
    }

    // --- PARENT MODE: Location Paakurathu ---
    function startParentMode() {
        const id = getID();
        if(!id) return alert("Email podunga!");

        document.getElementById('status').innerText = "🔎 Live Tracking Kid...";
        db.ref('tracking/' + id).on('value', (snap) => {
            const data = snap.val();
            if(data) {
                marker.setLatLng([data.lat, data.lng]);
                map.setView([data.lat, data.lng], 17);
                document.getElementById('status').innerText = "Last Seen: " + data.lastSeen;
            }
        });
    }

    // --- SOUND TRIGGER: Satham வரவைக்க ---
    function triggerSound() {
        const id = getID();
        if(!id) return alert("Email podunga!");
        db.ref('tracking/' + id).update({ sound_trigger: true });
        document.getElementById('status').innerText = "🔊 Command Sent: Playing Alert Sound!";
    }
</script>
</body>
</html>
