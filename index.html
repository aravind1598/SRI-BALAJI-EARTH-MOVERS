<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FamilyGuard Pro | Premium Tracker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.2);
            --primary: #6366f1;
            --secondary: #f43f5e;
        }
        body {
            margin: 0; font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container {
            width: 90%; max-width: 450px; padding: 30px;
            background: var(--glass); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        h2 { text-align: center; font-weight: 600; letter-spacing: 1px; margin-bottom: 25px; }
        input {
            width: 100%; padding: 15px; margin-bottom: 20px; border: none;
            border-radius: 12px; background: rgba(255,255,255,0.1);
            color: white; outline: none; box-sizing: border-box;
        }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        button {
            padding: 15px; border: none; border-radius: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease;
        }
        .btn-kid { background: var(--secondary); color: white; }
        .btn-parent { background: var(--primary); color: white; }
        .btn-sound { 
            grid-column: span 2; background: #eab308; color: #000; margin-top: 10px;
        }
        button:hover { transform: translateY(-3px); opacity: 0.9; }
        #map { 
            height: 300px; width: 100%; border-radius: 18px; 
            margin-top: 25px; border: 1px solid rgba(255,255,255,0.2); 
        }
        #status { font-size: 12px; text-align: center; margin-top: 15px; color: #94a3b8; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛡️ FamilyGuard <span style="color:var(--primary)">Pro</span></h2>
    <input type="email" id="email" placeholder="Enter Premium ID (Email)">
    
    <div class="btn-grid">
        <button class="btn-kid" onclick="startKidMode()">Kid Mode</button>
        <button class="btn-parent" onclick="startParentMode()">Parent Mode</button>
        <button class="btn-sound" onclick="triggerSound()">🔔 Play Emergency Sound</button>
    </div>

    <div id="status">Ready to Secure</div>
    <div id="map"></div>
</div>

<audio id="alertSound" loop>
    <source src="https://www.soundjay.com/buttons/sounds/beep-01a.mp3" type="audio/mpeg">
</audio>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Firebase Config (Replace with your actual keys)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "YOUR_DATABASE_URL",
        projectId: "YOUR_PROJECT_ID",
        appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map = L.map('map').setView([13.08, 80.27], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
    let marker = L.marker([0,0]).addTo(map);
    const audio = document.getElementById('alertSound');

    function getID() { return btoa(document.getElementById('email').value).replace(/=/g, ""); }

    // --- KID MODE ---
    function startKidMode() {
        const id = getID();
        document.getElementById('status').innerText = "📍 Background Tracking Active...";
        
        // Listen for Sound Trigger from Parent
        db.ref('tracking/' + id + '/sound_trigger').on('value', (snap) => {
            if(snap.val() === true) {
                audio.play();
                alert("Emergency Alert from Parent!");
                // Sound stop panna 5 seconds kazhithu reset pannuvom
                setTimeout(() => { 
                    audio.pause(); 
                    db.ref('tracking/' + id).update({ sound_trigger: false });
                }, 5000);
            }
        });

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                db.ref('tracking/' + id).update({
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    lastSeen: new Date().toLocaleTimeString()
                });
            }, null, { enableHighAccuracy: true });
        }
    }

    // --- PARENT MODE ---
    function startParentMode() {
        const id = getID();
        db.ref('tracking/' + id).on('value', (snap) => {
            const data = snap.val();
            if(data) {
                marker.setLatLng([data.lat, data.lng]);
                map.setView([data.lat, data.lng], 16);
                document.getElementById('status').innerText = "Last Seen: " + data.lastSeen;
            }
        });
    }

    // --- TRIGGER SOUND ---
    function triggerSound() {
        const id = getID();
        db.ref('tracking/' + id).update({ sound_trigger: true });
        document.getElementById('status').innerText = "🔊 Command Sent: Playing Sound...";
    }
</script>
</body>
</html>
